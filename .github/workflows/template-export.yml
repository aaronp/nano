# Mirrors templates/nano-template to aaronp/nano-template (its main branch) when it changes on master.
# One-time setup: create aaronp/nano-template (empty; Settings → "Template repository"; Pages source "GitHub
# Actions"), and add a TEMPLATE_TOKEN secret here: a fine-grained token with Contents read/write on that repo.
name: Export template

on:
  push:
    branches: [master]
    paths: ['templates/nano-template/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export
        env:
          TEMPLATE_TOKEN: ${{ secrets.TEMPLATE_TOKEN }}
        run: |
          [ -n "$TEMPLATE_TOKEN" ] || { echo "Add a TEMPLATE_TOKEN secret (see this workflow's header)."; exit 1; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/template-export.sh "https://x-access-token:${TEMPLATE_TOKEN}@github.com/aaronp/nano-template.git"
