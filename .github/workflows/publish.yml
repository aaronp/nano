# Publishes @pritzlaff/nano-core, nano-runes and nano-elements to npm when a version tag is pushed.
#   bun scripts/version.ts 0.2.0 && git commit -am "release 0.2.0" && git tag v0.2.0 && git push --follow-tags
# Authentication: npm trusted publishing (OIDC). On npmjs.com, each package → Settings → Trusted publishing →
# GitHub Actions, repository aaronp/nano, workflow publish.yml. Until then (a package must exist before it can trust
# a workflow), an NPM_TOKEN repository secret is used if present.
# Re-running is safe: a version that is already on npm is skipped.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # trusted publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5+)
        run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - name: Type check
        run: node_modules/.bin/tsc -p .
      - name: Test
        run: for p in core runes elements; do (cd packages/$p && bun test); done
      - name: Build
        run: bun scripts/build-packages.ts
      - name: The tag matches the packages' version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for p in core runes elements; do
            v=$(node -p "require('./packages/$p/dist/package.json').version")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "packages/$p is $v but the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Installs and runs as a stranger would
        run: bun scripts/smoke-packages.ts
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in core runes elements; do
            name=$(node -p "require('./packages/$p/dist/package.json').name")
            version=$(node -p "require('./packages/$p/dist/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already published"; continue; fi
            npm publish "packages/$p/dist" --provenance --access public
          done
