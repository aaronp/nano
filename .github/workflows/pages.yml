# Tests everything and builds the ui-workspace host; on master, publishes it to GitHub Pages.
# Pull requests run the same tests and build (so a merge can't break master), but don't deploy.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels one in progress.
# A pull request has its own group, and a newer push to it cancels its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Test
        run: |
          for p in core runes elements bundle platform editor puzzle-port wires sdk ui widgets connections puzzle-editor ui-workspace; do (cd packages/$p && bun test --isolate) || exit 1; done   # --isolate: a fresh global per test file, whatever order the OS lists them in
      - name: The template, against this commit's libraries
        run: bun scripts/template-check.ts
      - name: Build
        working-directory: packages/ui-workspace
        run: bun run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui-workspace/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
