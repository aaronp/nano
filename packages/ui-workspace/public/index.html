<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nano</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;600&family=Bricolage+Grotesque:wght@500;600;700&family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Architects+Daughter&family=Caveat:wght@600;700&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="./shared/golden-layout.css">
  <link rel="stylesheet" href="./app.css">
  <!-- The shared libraries (scripts/build.ts): one copy, the host's, for main.js and every module it imports. -->
  <script type="importmap">
  {
    "imports": {
      "@pritzlaff/nano-core": "./shared/nano.js",
      "@pritzlaff/nano-elements": "./shared/nano-elements.js",
      "@pritzlaff/nano-ui": "./bundle/nano-ui.js",
      "lit": "./shared/lit.js",
      "lit/directives/ref.js": "./shared/lit-ref.js",
      "lit/directives/style-map.js": "./shared/lit-style-map.js",
      "typebox": "./shared/typebox.js",
      "typebox/value": "./shared/typebox-value.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</head>
<body>
<app-shell>
  <span slot="title">Nano</span>
  <workspace-app-bar slot="title-actions"></workspace-app-bar>
  <a slot="nav" href="#/workspace">Workspace</a>
  <a slot="nav" href="#/themes">Themes</a>
  <a slot="nav" href="#/settings">Settings</a>

  <app-route path="/workspace" bleed><workspace-shell heading="Nano"><workspace-dock></workspace-dock></workspace-shell></app-route>
  <app-route path="/themes">
    <header class="page-head"><h1>Themes</h1><p>Your choice is remembered in this browser.</p></header>
    <theme-picker layout="cards"></theme-picker>
  </app-route>
  <app-route path="/settings">
    <header class="page-head"><h1>Settings</h1><p>How the workspace remembers its layout.</p></header>
    <button type="button" id="reset-layout">Forget pane sizes and the saved layout</button>
  </app-route>
  <app-route path="*">
    <header class="page-head"><h1>Page not found</h1><p>Nothing lives at this address. <a href="#/workspace">Go to the workspace</a>.</p></header>
  </app-route>
</app-shell>
</body>
</html>
