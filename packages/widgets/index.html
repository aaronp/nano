<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget flow demo</title>
  <style>
    /* The page uses the same theme tokens as the components, so one switch themes everything. */
    body { font: 14px/1.4 var(--c-font, system-ui, sans-serif); margin: 0; padding: 1.5rem 1rem; background: var(--c-surface, #f5f5f4); color: var(--c-fg, #1c1917); }
    main { max-width: 64rem; margin: 0 auto; display: grid; gap: 1rem; }
    .flow { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    section { background: var(--c-bg, #fff); border: 1px solid var(--c-line, #e7e5e4); border-radius: var(--c-radius, 6px); padding: .75rem 1rem; min-width: 0; overflow-x: auto; }
    h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--c-muted, #78716c); margin: 0 0 .5rem; }
    h2 small { text-transform: none; letter-spacing: 0; }
    header { max-width: 64rem; margin: 0 auto 1rem; display: flex; justify-content: flex-end; gap: .5rem; align-items: center; }
  </style>
</head>
<body>
  <header><label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
  <main>
    <div class="flow">
      <section><h2>slider <small>publishes value-changed</small></h2><div id="slider"></div></section>
      <section><h2>doubler <small>in → mapped</small></h2><div id="doubler"></div></section>
      <section><h2>counter <small>count → reached</small></h2><div id="counter"></div></section>
      <section><h2>chart <small>push ← doubler</small></h2><div id="chart"></div></section>
    </div>
    <section><h2>log <small>subscribes to every publication</small></h2><div id="log"></div></section>
    <section><h2>debug <small>composite</small></h2><p><button id="hello">Call set-input from the page</button></p><div id="debug"></div></section>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
