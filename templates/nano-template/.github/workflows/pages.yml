# Builds dist/ and publishes it to GitHub Pages: the nano.json a host imports is then
# https://<owner>.github.io/<repo>/nano.json, next to the module.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - run: bun test
      - id: pages
        uses: actions/configure-pages@v5
      - run: bun run build
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/   # dist/nano.json names ${PUBLIC_URL}index.js: a downloaded copy loads too
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
