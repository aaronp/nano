<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget slot</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; min-height: {{minH}}; font-family: {{t.body}}; color: {{t.fg}}">

  <sc-if value="{{c.isEmptyEditing}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{c.place}}" onDragOver="{{c.allowDrop}}" onDrop="{{c.drop}}" style="flex: 1; min-height: {{minH}}; width: 100%; box-sizing: border-box; border: {{emptyBorder}}; border-radius: {{t.radius}}; background: {{emptyBg}}; color: {{t.emptyFg}}; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span style="font-size: 13px; font-weight: 600">{{emptyText}}</span>
    </button>
  </sc-if>

  <sc-if value="{{c.isFilled}}" hint-placeholder-val="{{ true }}">
    <div onDragOver="{{c.allowDrop}}" style="position: relative; flex: 1; min-height: {{minH}}; box-sizing: border-box; border: {{t.border}}; border-radius: {{t.radius}}; background: {{t.bg}}; box-shadow: {{frameShadow}}; display: flex; flex-direction: column; overflow: hidden">
      <sc-if value="{{c.editing}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{c.select}}" aria-label="Select {{c.kindName}} widget" style="position: absolute; right: 4px; top: 4px; z-index: 1; display: flex; align-items: center; gap: 4px; padding: 2px 7px; border: 0; border-radius: 4px; background: {{tagBg}}; color: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 11px; cursor: pointer">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
          {{c.kindName}}
        </button>
      </sc-if>
      <div style="flex: 1; padding: {{t.pad}}; overflow: auto; display: flex; flex-direction: column; gap: 8px">
        <sc-if value="{{isMd}}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{blocks}}" as="b" hint-placeholder-count="4">
            <sc-if value="{{b.h1}}" hint-placeholder-val="{{ false }}"><h2 style="margin: 0; font-family: {{t.display}}; font-size: {{t.h1}}; line-height: 1.15; color: {{t.fg}}">{{b.text}}</h2></sc-if>
            <sc-if value="{{b.h2}}" hint-placeholder-val="{{ false }}"><h3 style="margin: 0; font-family: {{t.display}}; font-size: {{t.h2}}; line-height: 1.2; color: {{t.fg}}">{{b.text}}</h3></sc-if>
            <sc-if value="{{b.p}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: {{t.size}}; line-height: 1.5"><sc-for list="{{b.parts}}" as="pt"><sc-if value="{{pt.bold}}"><strong>{{pt.text}}</strong></sc-if><sc-if value="{{pt.plain}}">{{pt.text}}</sc-if></sc-for></p></sc-if>
            <sc-if value="{{b.li}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px; font-size: {{t.size}}; line-height: 1.5"><span aria-hidden="true" style="color: {{t.accent}}">{{t.bullet}}</span><span><sc-for list="{{b.parts}}" as="pt"><sc-if value="{{pt.bold}}"><strong>{{pt.text}}</strong></sc-if><sc-if value="{{pt.plain}}">{{pt.text}}</sc-if></sc-for></span></div></sc-if>
            <sc-if value="{{b.quote}}" hint-placeholder-val="{{ false }}"><blockquote style="margin: 0; padding: 6px 12px; border-radius: 4px; background: {{t.quoteBg}}; font-size: {{t.size}}; line-height: 1.5; font-style: italic">{{b.text}}</blockquote></sc-if>
          </sc-for>
        </sc-if>
        <sc-if value="{{isOther}}" hint-placeholder-val="{{ false }}">
          <div style="flex: 1; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; background: {{t.quoteBg}}; font-size: {{t.size}}; text-align: center; padding: 12px">
            <strong>{{c.kindName}}</strong>
            <span>[Widget preview appears once it is installed and loaded]</span>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cell":{"editor":null},"$preview":{"width":520,"height":300}}'>
class Component extends DCLogic {
  static defaultTheme() {
    return {
      border: '1px solid #DADDE3', radius: '8px', bg: '#FFFFFF', fg: '#16181D', shadow: 'none', emptyFg: '#3F4452',
      accent: '#3D4FD8', quoteBg: '#F1F2F5', bullet: '•',
      body: "'Geist', system-ui, sans-serif", display: "'Geist', system-ui, sans-serif",
      h1: '24px', h2: '18px', size: '14px', pad: '14px 16px'
    };
  }

  static demoCell() {
    return {
      id: 's-welcome', editing: true, kind: 'markdown', kindName: 'Markdown', minHpx: '220px',
      armed: false, selected: true, isFilled: true, isEmptyEditing: false,
      source: '# Welcome\nThis slot holds the **Markdown** content widget.\n- Edit its source in the drawer\n> Layout lives in the wireframe; styles only change the look.'
    };
  }

  static parts(text) {
    const out = [];
    text.split('**').forEach((seg, i) => {
      if (seg === '') return;
      const bold = i % 2 === 1;
      out.push({ text: seg, bold, plain: !bold });
    });
    return out;
  }

  static parse(source) {
    if (typeof source !== 'string') throw new Error('bug: markdown source must be a string');
    const blocks = [];
    const strip = (x) => x.split('**').join('');
    source.split('\n').forEach((raw) => {
      const line = raw.trimEnd();
      if (line.trim() === '') return;
      const base = { h1: false, h2: false, p: false, li: false, quote: false, text: '', parts: [] };
      if (line.indexOf('# ') === 0) blocks.push(Object.assign(base, { h1: true, text: strip(line.slice(2)) }));
      else if (/^#{2,6}\s/.test(line)) blocks.push(Object.assign(base, { h2: true, text: strip(line.replace(/^#+\s/, '')) }));
      else if (line.indexOf('- ') === 0 || line.indexOf('* ') === 0) blocks.push(Object.assign(base, { li: true, parts: Component.parts(line.slice(2)) }));
      else if (line.indexOf('> ') === 0) blocks.push(Object.assign(base, { quote: true, text: strip(line.slice(2)) }));
      else blocks.push(Object.assign(base, { p: true, parts: Component.parts(line) }));
    });
    return blocks;
  }

  renderVals() {
    const c = this.props.cell ?? Component.demoCell();
    const t = Object.assign({}, Component.defaultTheme(), c.t || {});
    const isMd = c.kind === 'markdown';
    return {
      c, t,
      minH: c.minHpx || '120px',
      isMd, isOther: !!c.isFilled && !isMd,
      blocks: isMd ? Component.parse(c.source) : [],
      frameShadow: c.selected ? '0 0 0 3px #5B68E8' + (t.shadow && t.shadow !== 'none' ? ', ' + t.shadow : '') : t.shadow,
      tagBg: c.selected ? '#5B68E8' : '#17181C',
      emptyBorder: c.armed ? '2px solid #5B68E8' : '1.5px dashed #5B68E8',
      emptyBg: c.armed ? 'rgba(91,104,232,0.16)' : 'rgba(91,104,232,0.05)',
      emptyText: c.armed ? 'Place here' : 'Empty slot'
    };
  }
}
</script>
</body>
</html>
